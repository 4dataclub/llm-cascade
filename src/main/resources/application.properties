# LLM-Cascade Service -- standalone Spring Boot

server.port=${SERVER_PORT:8090}

# Postgres -- WIRD VON HOST-PROJEKT BEREITGESTELLT.
# Kein eigener postgres-Container -- llm-cascade verbindet sich zur bereits
# vorhandenen Postgres des konsumierenden Projekts (EduPro, Switcher, ...).
# Eigene Tabellen-Namespace verhindert Kollisionen:
#   ai_model_config, llm_call_log, llm_failover_events, app_settings
# (Letztere kollidiert ggf. mit edupro.app_settings -- siehe README:
# Empfehlung ist eine separate DB pro Projekt, ABER selbe Postgres-Instanz.)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/llm_cascade}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security disabled -- der Service ist nur intern via Docker-Network erreichbar.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# KEINE env-basierten Default-Modelle. Die Modell-Konfig lebt in der DB +
# wird per Admin-UI (im konsumierenden Projekt) verwaltet. Bei leerer
# DB pusht der Konsument seine Defaults via POST /api/models beim Startup.

# Provider-BaseUrls -- pro Provider via ENV ueberschreibbar.
# OpenRouter normalerweise direkt; selbst-gehostete Proxies via OPENROUTER_BASE_URL.
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
# Ollama-Endpoint fuer den "ollama"-Provider-Bean. Container-Default zeigt auf den
# `ollama`-Service im docker-compose-Profile "local-llm". Lokal-Dev ohne Container:
#   OLLAMA_BASE_URL=http://localhost:11434/v1
ollama.base-url=${OLLAMA_BASE_URL:http://ollama:11434/v1}
