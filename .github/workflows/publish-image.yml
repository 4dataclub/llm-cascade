name: publish-image

# Baut das llm-cascade-Image und pusht es nach ghcr.io/4dataclub/llm-cascade.
# Zwei Trigger:
#   • Tag-Push (z.B. 0.9.0)  → Image-Tag = der git-Tag, gebaut aus dem Tag-Stand.
#   • workflow_dispatch      → Image-Tag = Eingabe, gebaut aus dem gewählten Branch/Ref.
# Nutzt das Actions-eigene GITHUB_TOKEN (packages: write) — kein PAT, kein Laptop-Push.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image-Tag (z.B. 0.9.0)'
        required: true
        default: '0.9.0'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/4dataclub/llm-cascade:${{ steps.v.outputs.version }}
